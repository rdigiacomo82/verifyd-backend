services:
  - type: web
    name: verifyd-backend
    runtime: python
    region: ohio
    plan: standard
    branch: main
    buildCommand: ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BASE_URL
        value: https://verifyd-backend.onrender.com
      - key: DATA_ROOT
        value: /tmp/verifyd-data
      # Keep all secrets and remaining runtime configuration in the Render dashboard.
      # The application database is the managed Postgres DATABASE_URL.
      # User uploads are stored in R2 when R2 is configured.
