; Explicitly permit ONLY the private echo test extension. NO outbound dialing and NO PSTN.
[default]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)

[from-livekit]
exten => 6000,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()
; Deny any other numeric dialed target, including 911 and 933.
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
exten => i,1,Hangup(21)