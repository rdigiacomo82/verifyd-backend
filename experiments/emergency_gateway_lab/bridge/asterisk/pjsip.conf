; PRIVATE ECHO PBX - NO external trunk, registration or dial-out
[transport-loopback]
type=transport
protocol=udp
bind=127.0.0.1:5070

[lab-livekit]
type=endpoint
transport=transport-loopback
context=from-livekit
disallow=all
allow=ulaw
rtp_symmetric=yes
force_rport=yes
direct_media=no
identify_by=ip

[lab-livekit]
type=identify
endpoint=lab-livekit
match=127.0.0.1/32