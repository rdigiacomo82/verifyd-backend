name: Voicemail Privacy PostgreSQL Integration

on:
  pull_request:
    paths:
      - 'trust_voice_voicemail_intelligence.py'
      - 'tests/test_voicemail_pg.py'
      - '.github/workflows/voicemail-postgres-integration.yml'
  push:
    paths:
      - 'trust_voice_voicemail_intelligence.py'
      - 'tests/test_voicemail_pg.py'
      - '.github/workflows/voicemail-postgres-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verifyd_voicemail_ci
          POSTGRES_USER: voicemail_test
          POSTGRES_PASSWORD: isolated_voicemail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicemail_test -d verifyd_voicemail_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      VERIFYD_VOICEMAIL_TEST_PG_URL: postgresql://voicemail_test:isolated_voicemail_ci@localhost:5432/verifyd_voicemail_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary
      - name: Confirm recipient-only report, delete race and cascade cleanup
        run: python -m unittest discover -s tests -p test_voicemail_pg.py -v
