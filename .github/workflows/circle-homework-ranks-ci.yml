name: Circle homework/ranking PostgreSQL checks

on:
  push:
    branches:
      - feature/circle-ranks-trust-cards-20261111
  pull_request:
    paths:
      - 'trust_voice_homework.py'
      - 'trust_voice_homework_catalog.json'
      - 'trust_voice_ranks.py'
      - 'tests/test_circle_homework*.py'
      - '.github/workflows/circle-homework-ranks-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circletest
          POSTGRES_USER: circle
          POSTGRES_PASSWORD: circle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circle -d circletest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://circle:circle@127.0.0.1:5432/circletest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3" "psycopg2-binary>=2.9,<3"
      - name: Compile new routers
        run: python -m py_compile trust_voice_homework.py trust_voice_ranks.py
      - name: Run isolated Homework and PostgreSQL integration tests
        run: python -m unittest discover -s tests -p "test_circle_homework*.py" -v
