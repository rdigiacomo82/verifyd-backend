name: Therapy professional application privacy and approval
on:
  push:
    paths:
      - 'trust_voice_therapy_professionals.py'
      - 'trust_voice_therapy_practice.py'
      - 'main.py'
      - 'tests/test_therapy_professional_registration_postgres.py'
      - '.github/workflows/therapy-professional-approval.yml'
  pull_request:
    paths:
      - 'trust_voice_therapy_professionals.py'
      - 'trust_voice_therapy_practice.py'
      - 'main.py'
      - 'tests/test_therapy_professional_registration_postgres.py'
      - '.github/workflows/therapy-professional-approval.yml'
jobs:
  adult-professional-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verifydtest
          POSTGRES_PASSWORD: localtestonly
          POSTGRES_DB: verifydtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://verifydtest:localtestonly@localhost:5432/verifydtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated verification dependencies
        run: pip install fastapi 'pydantic>=2' psycopg2-binary
      - name: Compile new application and existing practice routers
        run: python -m py_compile trust_voice_therapy_professionals.py trust_voice_therapy_practice.py tests/test_therapy_professional_registration_postgres.py main.py
      - name: Verify independent review and pending/approved/revoked isolation
        run: python -m unittest discover -s tests -p 'test_therapy_professional_registration_postgres.py' -v