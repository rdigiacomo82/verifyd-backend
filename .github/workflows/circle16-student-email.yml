name: Circle 16 TEST student email authentication
on:
  pull_request:
    paths:
      - 'trust_voice_school_student_email.py'
      - 'trust_voice_school_student_device.py'
      - 'tests/test_school_student_email.py'
      - 'tests/test_school_student_device.py'
      - 'main.py'
      - '.github/workflows/circle16-student-email.yml'
  push:
    branches: [main]
    paths:
      - 'trust_voice_school_student_email.py'
      - 'trust_voice_school_student_device.py'
      - 'tests/test_school_student_email.py'
      - 'main.py'
  workflow_dispatch:

jobs:
  supervised-email-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install school test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'fastapi>=0.109,<1' 'pydantic>=2,<3' 'psycopg2-binary>=2.9,<3' 'python-multipart>=0.0.9' 'python-docx>=1.1,<2' 'pypdf>=4,<7' 'reportlab>=4,<5'
      - name: Compile supervised student email source and its tests
        run: |
          python -m py_compile trust_voice_school_student_email.py trust_voice_school_student_device.py tests/test_school_student_email.py tests/test_school_student_device.py main.py
      - name: Test school-only email OTP and legacy code sessions
        run: |
          python -m unittest discover -s tests -p 'test_school_student_email.py' -v
          python -m unittest discover -s tests -p 'test_school_student_device.py' -v
