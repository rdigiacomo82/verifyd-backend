name: Trust Voice Blocking Integration

on:
  pull_request:
    paths:
      - 'trust_voice_blocking.py'
      - 'tests/test_trust_voice_blocking_pg.py'
      - '.github/workflows/blocking-operational.yml'
  push:
    paths:
      - 'trust_voice_blocking.py'
      - 'tests/test_trust_voice_blocking_pg.py'
      - '.github/workflows/blocking-operational.yml'

permissions:
  contents: read

jobs:
  blocking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verifyd_blocking_ci
          POSTGRES_USER: block_test
          POSTGRES_PASSWORD: isolated_block_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U block_test -d verifyd_blocking_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      VERIFYD_BLOCKING_TEST_PG_URL: postgresql://block_test:isolated_block_ci@localhost:5432/verifyd_blocking_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary
      - run: python -m py_compile trust_voice_blocking.py tests/test_trust_voice_blocking_pg.py
      - run: python -m unittest discover -s tests -p 'test_trust_voice_blocking_pg.py' -v
