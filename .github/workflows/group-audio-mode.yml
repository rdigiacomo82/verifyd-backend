name: VeriFYD Circle group audio mode
on:
  pull_request:
    paths:
      - 'trust_voice_group_video.py'
      - 'tests/test_group_audio_mode.py'
      - 'tests/test_group_audio_source_contract.py'
      - '.github/workflows/group-audio-mode.yml'
  push:
    branches: [main]
    paths:
      - 'trust_voice_group_video.py'
      - 'tests/test_group_audio_mode.py'
      - 'tests/test_group_audio_source_contract.py'
permissions:
  contents: read
jobs:
  group-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m py_compile trust_voice_group_video.py tests/test_group_audio_mode.py tests/test_group_audio_source_contract.py
      - run: python -m unittest discover -s tests -p 'test_group_audio_source_contract.py' -v
