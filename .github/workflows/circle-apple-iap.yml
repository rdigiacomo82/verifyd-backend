name: VeriFYD Circle Apple IAP gate
on:
  pull_request:
    paths:
      - 'trust_voice_circle_apple_iap.py'
      - 'tests/test_circle_apple_iap_contract.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/circle-apple-iap.yml'
  workflow_dispatch:
jobs:
  apple-iap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: pip install --disable-pip-version-check 'fastapi>=0.109,<1' 'pydantic>=2,<3'
      - name: Python compile
        run: python -m py_compile main.py trust_voice_circle_apple_iap.py tests/test_circle_apple_iap_contract.py
      - name: Fail-closed StoreKit contract tests
        run: python -m unittest discover -s tests -p 'test_circle_apple_iap_contract.py' -v
