name: Circle email receiving diagnostics checks

on:
  push:
    branches: [fix/circle-email-receiving-stage1-diagnostics-20261029]
    paths:
      - "trust_voice_circle_email_inbound.py"
      - "tests/test_circle_email_inbound_retrieval.py"
      - ".github/workflows/circle-email-receiving-diagnostics.yml"
  pull_request:
    paths:
      - "trust_voice_circle_email_inbound.py"
      - "tests/test_circle_email_inbound_retrieval.py"
      - ".github/workflows/circle-email-receiving-diagnostics.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile trust_voice_circle_email_inbound.py
      - name: Offline receiving diagnostics regression tests
        run: python -m unittest discover -s tests -p 'test_circle_email_inbound_retrieval.py' -v
