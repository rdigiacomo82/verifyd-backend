name: Classroom privacy and quarantine integration

on:
  push:
    branches:
      - feature/circle-classroom-quarantine-20261112
  pull_request:
    paths:
      - trust_voice_classrooms.py
      - trust_voice_classroom_quarantine.py
      - trust_voice_personal_coursework.py
      - trust_voice_classroom_tools.py
      - tests/test_circle_classroom*.py
      - main.py
      - .github/workflows/circle-classroom-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circletest
          POSTGRES_USER: circle
          POSTGRES_PASSWORD: circle
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U circle -d circletest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://circle:circle@127.0.0.1:5432/circletest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3" "psycopg2-binary>=2.9,<3" "python-multipart>=0.0.9" "boto3>=1.34.0"
      - name: Compile Classroom and existing application entrypoint
        run: python -m py_compile trust_voice_classrooms.py trust_voice_classroom_quarantine.py trust_voice_personal_coursework.py trust_voice_classroom_tools.py main.py
      - name: Verify quarantine is fail-closed
        run: python -m unittest discover -s tests -p "test_circle_classroom_quarantine.py" -v
      - name: Verify class authorization, submissions and privacy
        run: python -m unittest discover -s tests -p "test_circle_classroom_postgres.py" -v
