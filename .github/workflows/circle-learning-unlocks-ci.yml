name: Learning-only Trust Rank and game unlock checks

on:
  push:
    branches: [feature/circle-learning-unlocks-no-game-rank-20261112]
  pull_request:
    paths:
      - trust_voice_learning_unlocks.py
      - trust_voice_ranks.py
      - tests/test_circle_learning_unlocks.py
      - .github/workflows/circle-learning-unlocks-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile trust_voice_ranks.py trust_voice_learning_unlocks.py main.py
      - name: Rank and unlock tests
        run: python -m unittest discover -s tests -p "test_circle_learning_unlocks.py" -v
