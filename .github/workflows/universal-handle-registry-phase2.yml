name: Universal Handle Registry Phase 2 Contract
on:
  pull_request:
    paths:
      - 'trust_voice_handle_registry_phase2.py'
      - 'tests/test_universal_handle_registry_phase2.py'
      - 'main.py'
      - '.github/workflows/universal-handle-registry-phase2.yml'
  workflow_dispatch:
jobs:
  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'pydantic>=2,<3' 'pytest>=8,<10'
      - name: Check Python syntax
        run: python -m py_compile trust_voice_handle_registry_phase2.py tests/test_universal_handle_registry_phase2.py
      - name: Run offline contract tests
        run: python -m pytest -q tests/test_universal_handle_registry_phase2.py
