      - 'trust_voice_school_multi_admin.py'
      - 'trust_voice_school_guardian_contacts.py'
      - 'trust_voice_school_incident_chat.py'
      - 'tests/test_verifyd_school_safety_training.py'
      - 'tests/test_verifyd_safety_consents.py'
      - 'tests/test_verifyd_safety_school_registration.py'
      - 'tests/test_verifyd_school_family_portal.py'
      - 'tests/test_verifyd_school_roster_batch.py'
      - 'tests/test_verifyd_school_communications.py'
      - 'tests/test_verifyd_school_family_onboarding.py'
      - 'tests/test_verifyd_school_child_activation.py'
      - 'tests/test_verifyd_school_demo_location.py'
      - 'tests/test_verifyd_school_unified_signup.py'
      - 'tests/test_verifyd_school_multi_admin.py'
      - 'tests/test_verifyd_school_guardian_contacts.py'
      - 'tests/test_verifyd_school_incident_chat.py'
      - 'tests/test_school_safety_family_text_private.py'
      - 'trust_voice_school_choice_catalog.py'
      - 'trust_voice_school_student_device.py'
      - 'tests/test_school_safety_choice_catalog.py'
      - 'tests/test_school_student_device.py'
      - 'tests/test_school_guardian_response_split.py'
      - 'tests/test_school_managed_roster.py'
      - '.github/workflows/verifyd-safety-training.yml'
jobs:
  training-contract:
    name: Safety training isolation, roles and no dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'fastapi>=0.109,<1' 'pydantic>=2,<3' 'psycopg2-binary>=2.9,<3'
      - run: python -m py_compile trust_voice_school_managed_roster.py tests/test_school_managed_roster.py trust_voice_school_safety_training.py trust_voice_school_safety_consents.py trust_voice_school_safety_registration.py trust_voice_school_family_portal.py trust_voice_school_roster_batch.py trust_voice_school_communications.py trust_voice_school_family_onboarding.py trust_voice_school_child_activation.py trust_voice_school_demo_location.py trust_voice_school_unified_signup.py trust_voice_school_multi_admin.py trust_voice_school_guardian_contacts.py trust_voice_school_incident_chat.py trust_voice_school_choice_catalog.py trust_voice_school_student_device.py tests/test_school_safety_choice_catalog.py tests/test_school_student_device.py tests/test_verifyd_school_safety_training.py tests/test_verifyd_safety_consents.py tests/test_verifyd_safety_school_registration.py tests/test_verifyd_school_family_portal.py tests/test_verifyd_school_roster_batch.py tests/test_verifyd_school_communications.py tests/test_verifyd_school_family_onboarding.py tests/test_verifyd_school_child_activation.py tests/test_verifyd_school_demo_location.py tests/test_verifyd_school_unified_signup.py tests/test_verifyd_school_multi_admin.py tests/test_verifyd_school_guardian_contacts.py tests/test_verifyd_school_incident_chat.py tests/test_school_safety_family_text_private.py
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_safety_training.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_safety_consents.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_safety_school_registration.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_family_portal.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_roster_batch.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_communications.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_family_onboarding.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_child_activation.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_demo_location.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_unified_signup.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_multi_admin.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_guardian_contacts.py' -v
      - run: python -m unittest discover -s tests -p 'test_verifyd_school_incident_chat.py' -v
      - run: python -m unittest discover -s tests -p 'test_school_safety_family_text_private.py' -v
      - run: python -m unittest discover -s tests -p 'test_school_safety_choice_catalog.py' -v
      - run: python -m unittest discover -s tests -p 'test_school_student_device.py' -v
      - run: python -m unittest discover -s tests -p 'test_school_guardian_response_split.py' -v
      - run: python -m unittest discover -s tests -p 'test_school_managed_roster.py' -v
