name: Circle email flexible message and sender identity checks

on:
  push:
    branches: [fix/circle-email-optional-body-personal-from-20261029]
    paths:
      - trust_voice_circle_email.py
      - tests/test_circle_email_optional_body_sender.py
      - .github/workflows/circle-email-sendflex-check.yml
  pull_request:
    paths:
      - trust_voice_circle_email.py
      - tests/test_circle_email_optional_body_sender.py
      - .github/workflows/circle-email-sendflex-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile trust_voice_circle_email.py
      - name: Subject-only, attachment-only and From identity tests
        run: python -m unittest discover -s tests -p 'test_circle_email_optional_body_sender.py' -v
      - name: Existing attachment regression tests
        run: python -m unittest discover -s tests -p 'test_circle_email_attachments.py' -v
