name: Circle Inbound Attachment Recovery
on:
  push:
    branches: [feature/circle-recover-inbound-attachments-20261030]
    paths:
      - "trust_voice_circle_email.py"
      - "trust_voice_circle_email_transport.py"
      - "tests/test_circle_email_attachment_recovery.py"
      - ".github/workflows/circle-inbound-attachment-recovery.yml"
  pull_request:
    paths:
      - "trust_voice_circle_email.py"
      - "trust_voice_circle_email_transport.py"
      - "tests/test_circle_email_attachment_recovery.py"
      - ".github/workflows/circle-inbound-attachment-recovery.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python module syntax
        run: python -m py_compile trust_voice_circle_email.py trust_voice_circle_email_transport.py trust_voice_circle_email_inbound.py
      - name: Verify recipient authorization and recovery idempotence
        run: python -m unittest discover -s tests -p 'test_circle_email_attachment_recovery.py' -v
      - name: Preserve existing mail, security and sign-in
        run: |
          python -m unittest discover -s tests -p 'test_circle_email_attachments.py' -v
          python -m unittest discover -s tests -p 'test_circle_email_inbox_sql.py' -v
          python -m unittest discover -s tests -p 'test_circle_email_custom_folders.py' -v
          python -m unittest discover -s tests -p 'test_circle_email_bulk_actions.py' -v
          python -m unittest discover -s tests -p 'test_trust_voice_session_db_resilience.py' -v
