name: Circle outgoing reply instruction order
on:
  pull_request:
    paths:
      - 'trust_voice_circle_email.py'
      - 'tests/test_circle_email_outbound_reply_note_order.py'
      - '.github/workflows/circle-email-reply-note-order.yml'
  push:
    paths:
      - 'trust_voice_circle_email.py'
      - 'tests/test_circle_email_outbound_reply_note_order.py'
      - '.github/workflows/circle-email-reply-note-order.yml'
jobs:
  reply-note-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile outbound email module
        run: python -m py_compile trust_voice_circle_email.py
      - name: Check reply note above message
        run: python -m unittest discover -s tests -p 'test_circle_email_outbound_reply_note_order.py' -v
