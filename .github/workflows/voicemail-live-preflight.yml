name: Voicemail Live Preflight

on:
  pull_request:
    paths:
      - 'tests/voicemail_live_preflight.py'
      - '.github/workflows/voicemail-live-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/voicemail_live_preflight.py
