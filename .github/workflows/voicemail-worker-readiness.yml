name: Voicemail Worker Readiness Probe Checks

on:
  pull_request:
    paths:
      - 'verifyd_worker.py'
      - 'tests/test_voicemail_worker_readiness.py'
      - '.github/workflows/voicemail-worker-readiness.yml'
  push:
    paths:
      - 'verifyd_worker.py'
      - 'tests/test_voicemail_worker_readiness.py'
      - '.github/workflows/voicemail-worker-readiness.yml'

permissions:
  contents: read

jobs:
  safe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile verifyd_worker.py tests/test_voicemail_worker_readiness.py
      - run: python -m unittest discover -s tests -p 'test_voicemail_worker_readiness.py' -v
