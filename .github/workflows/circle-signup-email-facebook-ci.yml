name: Circle signup email and Facebook regression

on:
  push:
    branches: [fix/circle-signup-deliverability-facebook-20261112]
  pull_request:
    paths:
      - trust_voice_identity.py
      - trust_voice_social_links.py
      - emailer.py
      - tests/test_circle_signup_email_facebook.py
      - .github/workflows/circle-signup-email-facebook-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"
      - name: Compile unchanged and changed routers
        run: python -m py_compile emailer.py trust_voice_identity.py trust_voice_social_links.py trust_voice_signaling.py
      - name: Test verified signup, OTP formatting and FB profiles
        run: python -m unittest discover -s tests -p "test_circle_signup_email_facebook.py" -v
