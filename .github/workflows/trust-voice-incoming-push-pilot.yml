name: Circle locked-screen incoming push pilot — OFF by default

on:
  pull_request:
    paths:
      - "trust_voice_signaling.py"
      - "tests/test_trust_voice_incoming_call_push_pilot.py"
      - ".github/workflows/trust-voice-incoming-push-pilot.yml"
      - "docs/LOCKED_SCREEN_INCOMING_CALL_DESIGN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run isolated pilot tests
        run: |
          python -m py_compile trust_voice_signaling.py
          python -m unittest discover -s tests -p 'test_trust_voice_incoming_call_push_pilot.py' -v
          python -m unittest discover -s tests -p 'test_trust_voice_session_db_resilience.py' -v
