name: Circle Location PostgreSQL Integration

on:
  push:
    paths:
      - 'trust_voice_location.py'
      - 'tests/test_trust_voice_location.py'
      - 'tests/test_trust_voice_location_pg.py'
      - '.github/workflows/location-postgres-integration.yml'
  pull_request:
    paths:
      - 'trust_voice_location.py'
      - 'tests/test_trust_voice_location.py'
      - 'tests/test_trust_voice_location_pg.py'
      - '.github/workflows/location-postgres-integration.yml'

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verifyd_location_ci
          POSTGRES_USER: verifyd_test
          POSTGRES_PASSWORD: isolated_location_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifyd_test -d verifyd_location_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      VERIFYD_LOCATION_TEST_PG_URL: postgresql://verifyd_test:isolated_location_ci@localhost:5432/verifyd_location_ci
      VERIFYD_TRUST_VOICE_LOCATION_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary
      - name: Verify isolated schema, selected viewers, stop sharing and cascade deletion
        run: python -m unittest discover -s tests -p 'test_trust_voice_location_pg.py' -v
